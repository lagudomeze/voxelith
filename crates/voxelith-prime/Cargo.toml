# crates/voxelith-prime/Cargo.toml
[package]
name = "voxelith-prime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["inspector"]
# egui 世界检查器（debug 下拉）。需要窗口 + 渲染，故可关闭以跑无头模式。
inspector = ["dep:bevy-inspector-egui"]

[dependencies]
# L2 允许完整 bevy（R6、R18）。
# - `bevy_remote`：BRP 服务器，供 AI / 脚本通过 HTTP 访问组件数据。
# - `debug`：组件/类型名可用；缺了它组件名会打印成 FEATURE_DISABLED，检查器看起来是空的。
# - `png`：`AssetServer` 加载 `.png`（UI 图集、精灵表、**GLB 的外链贴图**）。
# - `bevy_gltf`：加载 `.glb` 模型（Kenney 的 3D 套件都是这个格式）。
# - `file_watcher`：**配置热重载**（改 `assets/data/*.ron` 立刻生效）。
#   编进来并不意味着一直开着：`main.rs` 用 `watch_for_changes_override` 只在
#   debug 构建里打开监视（出货版本不该挂文件监视器）。
bevy = { workspace = true, features = ["bevy_remote", "debug", "png", "bevy_gltf", "file_watcher"] }
bevy_brp_extras = { workspace = true }
bevy-inspector-egui = { workspace = true, optional = true }
# egui 本体：**直接依赖**（不靠 inspector 间接带进来）。
# 理由：它是"8 个生态库"之一，要有自己的接线口（`EguiPlugin` 装在 `EcosystemPlugin` 里），
# 而不是"只有开 inspector 时才碰巧存在"。debug 面板（战斗面板等）将来就搬到这里。
bevy_egui = { workspace = true }

# ── 生态插件（新架构的 L2 接线）─────────────────────────────────────────────
# 输入 / 音频 / 粒子 / 存档 / 资产加载 / 补间 / 物理。
avian3d = { workspace = true }
bevy_kira_audio = { workspace = true }
bevy_hanabi = { workspace = true }
leafwing-input-manager = { workspace = true }
bevy_tweening = { workspace = true }
bevy_asset_loader = { workspace = true }
moonshine-save = { workspace = true }
# 内容加载：读 `.ron` 文件并解析。**只允许出现在 L2**（R101 精神）——
# `axiom` 只提供描述结构与词汇映射，自己不碰文件系统。
ron = { workspace = true }
# 存档要序列化（save.rs）。与 axiom 用**同一个** serde 声明：
# 两处版本/特性不一致会导致 VoxelId 的派生 trait 对不上。
serde = { workspace = true }
icu_segmenter = { workspace = true }
icu_provider = { workspace = true }

[dependencies.voxelith-axiom]
workspace = true

# 新架构的中间层：技能三件套（gauge / gearbox / diesel）+ 格子空间后端 + 内容管线。
[dependencies.voxelith-abilities]
workspace = true

[dev-dependencies]
# **只给测试用**：`gltf_material` 的回归测试要**直接读 GLB 的 JSON chunk**
# 来验证根因（两组反向法线共用位置 + `doubleSided: true`），
# 而不是断言我自己的一个 bool。
#
# 为什么值得引入：这个 bug 的表现（"发黑、调光无效、有高光"）
# **完全不像**根因（共面三角形 z-fighting）。能读原始数据验证根因，
# 比"断言 unlit == true"有说服力得多。
serde_json = "1"
