[workspace]
resolver = "2"
members = [
    "crates/voxelith-axiom",
    "crates/voxelith-abilities",
    "crates/voxelith-prime",
    "probe/*"
]

# **`default-members`：把 probe 排除在"默认构建"之外。**
#
# 为什么需要它：`probe/glb` 是**排查工具**，不是产品代码，它依赖 `bevy_gltf`
# （主 crate 现在也开了这个 feature，但依赖面仍然不同）。
# 不排除的话，根目录一句 `cargo build` / `cargo test` 就会连带编译它 ——
# 而两个 crate 的 feature 组合不同，会**反复互相顶掉对方的编译产物**，
# 表现为"每次切来切去都在重新编译 bevy"。
#
# 排除之后：
#   `cargo build`          → 只构建 voxelith-axiom + voxelith-prime
#   `cargo build -p glb-probe` → 单独构建探针（与主构建共享 target 缓存）
#
# 注意 `cargo test --workspace` **会**包含它（那是显式的全量）。
default-members = [
    "crates/voxelith-axiom",
    "crates/voxelith-abilities",
    "crates/voxelith-prime",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = "0.19"
# 非 bevy 工具依赖（R5 登记制，见 docs/architecture.md 的"非 bevy 依赖登记表"）。
# 只开用得到的派生：Display / Error（不用 `full`，避免拉一堆用不上的宏）。
exn = "0.3"
derive_more = { version = "2", features = ["display", "error"] }

# axiom：只为了给 RON 描述结构派生 `Deserialize`（引擎自己不读文件，读文件是 L2 的事）。
serde = { version = "1", default-features = false, features = ["derive", "std"] }

# prime（L2）：真正读 `.ron` 文件的那一层（R101 精神：加载与反序列化都在 L2）。
ron = "0.12"

# ICU 分词器：
icu_segmenter = { version = "2.3", features = ["compiled_data"] }
icu_provider = { version = "2.2.0", features = ["logging"] }


[workspace.dependencies.bevy_app]
version = "0.19"

[workspace.dependencies.bevy_ecs]
version = "0.19"
# `debug` 打开后 B0001（查询访问冲突）之类的运行时报错会带上系统名与组件名，
# 否则只打印 `<Enable the debug feature to see the name>`。
#
# 它**一直是开的**（含发布构建），因为：
#   - 报错名是"系统顺序 / 查询冲突"这类问题的第一手线索，价值很高；
#   - 它本来就挂在 `bevy_ecs` 的默认特性里，额外成本很小。
#
# 试过两种"发布关掉"的写法，都不成立，所以不提供开关（不留骗人的旋钮）：
#   1. `[profile.*.package.bevy_ecs] features = [...]` —— **Cargo 不支持**，
#      manifest 会报 `unused manifest key: profile.*.package.bevy_ecs.features`；
#   2. 在 `voxelith-axiom` 上加默认 feature —— `voxelith-prime` 继承依赖时特征会合并，
#      `--no-default-features` 关不掉它。
# 真要裁掉时，直接删这一行。
features = ["debug"]

[workspace.dependencies.bevy_reflect]
version = "0.19"

# R5 修订（Q21）：axiom 允许用时间推进（Time/Duration），但不含任何渲染/资产/窗口 crate。
[workspace.dependencies.bevy_time]
version = "0.19"

# R5 修订（Q26）：axiom 允许用 Bevy 的状态机（States / NextState）。
# 它只依赖 bevy_ecs / bevy_app / bevy_reflect / bevy_platform，与渲染无关。
[workspace.dependencies.bevy_state]
version = "0.19"

# 调试设施只允许 prime（L2）使用，禁止进入 axiom（R5、R91、R99）。
[workspace.dependencies.bevy_brp_extras]
version = "0.22"

[workspace.dependencies.bevy-inspector-egui]
version = "0.37"

[workspace.dependencies.voxelith-axiom]
path = "crates/voxelith-axiom"

[workspace.dependencies.voxelith-abilities]
path = "crates/voxelith-abilities"

# ───────────────────────────────────────────────────────────────────────────
# 生态插件（新架构的基座）
#
# 注意：**每一项都要写自己的表头**。裸键会挂到上一个 `[workspace.dependencies.X]`
# 子表里去（TOML 的表头一直生效到下一个表头），那样 cargo 会说
# "dependency.bevy_diesel was not found in workspace.dependencies"。
# ───────────────────────────────────────────────────────────────────────────

# **技能三件套**：gearbox = 状态图，gauge = 属性图，diesel = 技能框架
# （把前两者粘起来：模板组合 / 目标管线 / 效果传播 / 空间后端）。
#
# ⚠️ `bevy_diesel 0.2` 依赖 `bevy_gearbox ^0.8`，所以这里**必须写 0.8**：
# 写成 0.9 会让 cargo 同时拉进两份 gearbox（0.x 的 `^0.8` = `>=0.8.0, <0.9.0`），
# 两份类型互不兼容，报错会非常难读。
[workspace.dependencies.bevy_diesel]
version = "0.2"

[workspace.dependencies.bevy_gauge]
version = "0.5"

[workspace.dependencies.bevy_gearbox]
version = "0.8"

# 其余生态库（先统一登记版本，按需接线到具体 crate）。
[workspace.dependencies.avian3d]
version = "0.7"

[workspace.dependencies.bevy_kira_audio]
version = "0.26"

[workspace.dependencies.bevy_egui]
version = "0.42"

[workspace.dependencies.bevy_hanabi]
version = "0.19"

[workspace.dependencies.leafwing-input-manager]
version = "0.21"

[workspace.dependencies.bevy_tweening]
version = "0.16"

[workspace.dependencies.bevy_asset_loader]
version = "0.27"

[workspace.dependencies.moonshine-save]
version = "0.7"

# ---------------------------------------------------------------------------
# 构建配置：Windows 上 Bevy 全量 debug 构建默认会撞 `LNK1102: out of memory`
# （MSVC link.exe 的 32 位地址空间限制，与机器物理内存无关）。
# 链接器改用 rust-lld：见 `.cargo/config.toml`。
# 这里降低依赖的调试信息量，进一步减小链接压力。
# ---------------------------------------------------------------------------

# 依赖用 line-tables-only 调试信息：链接快、体积小，仍足够定位 panic 位置。
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.dev]
# 本项目自身代码保留完整调试信息。
debug = true

[profile.test.package."*"]
debug = "line-tables-only"
